# Configuration for DSC-ViT with Hard K-Means clustering
#
# Key differences from default.yaml:
# 1. clustering_method: 'hard' (EM-based, no gradients)
# 2. num_clusters: Independent from num_classes (e.g., 50 clusters for 21 classes)
# 3. No cluster temperature (Hard K-Means doesn't use temperature)
# 4. Cluster loss disabled (no gradient flow through clustering)

# Model settings
model:
  image_channels: 3
  num_classes: 21  # PASCAL VOC (20 objects + 1 background)
  img_size: 256
  num_clusters: 2  # ⭐ Binary clustering (foreground/background)
  latent_dim: 512
  vit_model_name: 'vit_base_patch16_224'
  use_pretrained_vit: true
  use_simple_encoder: false  # Set to true for faster prototyping
  num_latent_updates: 6  # n: Number of reasoning latent (z) updates (TRM uses 6)
  num_recursive_steps: 3  # T: Frequency of answer latent (y) updates (TRM uses 3)
  fusion_method: 'residual'  # ⭐ Simple residual fusion (no attention overhead)
  freeze_vit: true
  clustering_method: 'hard'  # ⭐ Hard K-Means (EM-based)

# Loss settings
loss:
  lambda_aux: 0.4  # Weight for auxiliary deep supervision loss
  use_cluster_loss: false  # ⭐ Disabled (no gradient through clustering)
  cluster_loss_alpha: 0.0  # Not used
  cluster_loss_beta: 0.0   # Not used

# Optimizer settings (TRM paper settings)
optimizer:
  name: 'adamw'
  lr: 1.0e-4
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1

# Scheduler settings
scheduler:
  name: 'cosine'
  min_lr: 1.0e-6
  step_size: 30
  gamma: 0.1

# Training settings
training:
  epochs: 100
  batch_size: 8  # Adjust based on GPU memory
  num_workers: 8
  num_supervision_steps: 8  # N_sup: Deep supervision steps (TRM uses 16)
  val_interval: 1  # Validate every N epochs
  save_interval: 10  # Save checkpoint every N epochs
  grad_clip: 1.0  # Gradient clipping
  use_ema: true  # Exponential moving average (TRM uses this)
  ema_decay: 0.999
  warmup_epochs: 5
  exp_dir: 'experiments/hard_kmeans'

  # ACT (Adaptive Computational Time) - Early stopping per batch
  use_act: false  # Disabled for hard k-means experiments
  act_threshold: 0.0  # TRM paper: stop if q_logit > 0

# Data settings
data:
  dataset_name: 'voc'  # PASCAL VOC 2012
  data_root: 'data'
  train_split: 'train'  # 1,464 images (torchvision built-in)
  val_split: 'val'  # 1,449 images (official VOC val)

  # Augmentation (based on TRM paper)
  augmentation:
    random_flip: true
    random_crop: true
    color_jitter: true
    dihedral: true  # 8 dihedral transformations

# Note: cluster_temperature section removed (not used for hard k-means)
