# Default configuration for DSC-ViT training

# Model settings
model:
  image_channels: 3
  num_classes: 21  # PASCAL VOC (20 objects + 1 background)
  img_size: 256
  num_clusters: 6  # If null, use num_classes
  latent_dim: 768
  vit_model_name: 'vit_base_patch16_224'
  use_pretrained_vit: true
  use_simple_encoder: false  # Set to true for faster prototyping
  num_latent_updates: 4  # n: Number of reasoning latent (z) updates (TRM uses 6)
  num_recursive_steps: 2  # T: Frequency of answer latent (y) updates (TRM uses 3)
  fusion_method: 'attention'  # Options: 'residual', 'gated', 'attention'
  freeze_vit: true

  # Spatial context encoding (toggleable - from later commits)
  use_spatial_context: false  # Multi-scale spatial context (ASPP-based, disabled by default)
  spatial_context_type: 'aspp'  # Options: 'aspp', 'aspp_adaptive', 'simple'
  spatial_context_dropout: 0.15  # Dropout for spatial context (prevents overfitting)

# Loss settings
loss:
  lambda_aux: 0.4  # Weight for auxiliary deep supervision loss
  use_cluster_loss: true

  # Cluster loss components (toggleable)
  use_assignment_loss: false  # Cluster assignments match class labels (disabled by default)
  use_compactness_loss: true  # Features close to cluster centers
  use_separation_loss: true   # Cluster centers far from each other
  cluster_loss_alpha: 1.0  # Compactness weight (10x increase for stronger learning)
  cluster_loss_beta: 0.5  # Separation weight (10x increase for better cluster separation)

  # Focal Loss (addresses class imbalance and hard examples)
  use_focal_loss: true
  focal_alpha: 0.25  # Weighting factor (0.25 for foreground focus)
  focal_gamma: 2.0   # Focusing parameter (2.0 standard, higher = more focus on hard examples)

  # Binary Cross Entropy (multi-label approach)
  use_bce: true
  bce_weight: 0.8  # Weight for BCE component (combined with Focal/CE)

# Optimizer settings (TRM paper settings)
optimizer:
  name: 'adamw'
  lr: 1.0e-4
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  spatial_context_lr_scale: 0.1  # Spatial context LR = lr * this scale (prevents overfitting)

# Scheduler settings
scheduler:
  name: 'cosine'
  min_lr: 1.0e-6
  step_size: 30
  gamma: 0.1

# Training settings
training:
  epochs: 100
  batch_size: 32  # Adjust based on GPU memory
  num_workers: 8
  num_supervision_steps: 8  # N_sup: Deep supervision steps (TRM uses 16)
  val_interval: 1  # Validate every N epochs
  save_interval: 10  # Save checkpoint every N epochs
  grad_clip: 0.5  # Gradient clipping
  use_ema: true  # Exponential moving average (TRM uses this)
  ema_decay: 0.999
  warmup_epochs: 5
  exp_dir: 'experiments/default'

  # ACT (Adaptive Computational Time) - Early stopping per batch
  use_act: true
  act_threshold: 3.0  # TRM paper: stop if q_logit > 0

# Data settings
data:
  dataset_name: 'voc'  # PASCAL VOC 2012
  data_root: 'data'
  train_split: 'train'  # 1,464 images (torchvision built-in)
  val_split: 'val'  # 1,449 images (official VOC val)

  # Augmentation (based on TRM paper)
  augmentation:
    random_flip: true
    random_crop: true
    color_jitter: true
    dihedral: true  # 8 dihedral transformations

# Cluster temperature annealing (optional)
cluster_temperature:
  initial: 2.0  # Start softer for exploration
  final: 0.1    # End sharper for definitive assignments
  schedule: 'cosine'  # Smoother annealing (linear → cosine)
